name: Prepare NBA Pacific assets
on:
  push:
    paths: ['scripts/prepare-nba-pacific.cjs', '.github/workflows/nba-pacific.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        team: [GSW, LAC, LAL, PHX, SAC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-nba-pacific.cjs "${{ matrix.team }}"
