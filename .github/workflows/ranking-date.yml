name: Ranking image date
on:
  push:
    paths: ['app.js', 'exports.js', 'index.html', 'ranking-date-check.cjs', '.github/workflows/ranking-date.yml']
permissions:
  contents: read
jobs:
  date:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node ranking-date-check.cjs
