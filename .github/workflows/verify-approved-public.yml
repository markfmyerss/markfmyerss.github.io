name: Verify approved position pools live
on:
  push:
    branches: [verify-approved-position-pools-live]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node scripts/verify-approved-public.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-position-live-checks
          path: qa/
          retention-days: 7
