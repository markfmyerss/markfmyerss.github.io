name: Prepare NBA Atlantic snapshot
on:
  push:
    paths: ['scripts/probe-nba.cjs', '.github/workflows/nba-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-nba.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-source-snapshot
          path: qa/nba-probe/
          retention-days: 7
