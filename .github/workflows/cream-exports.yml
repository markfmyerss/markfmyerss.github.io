name: Cream team ranking images
on:
  push:
    paths: ['exports.js', 'index.html', 'cream-export-check.cjs', '.github/workflows/cream-exports.yml']
permissions:
  contents: read
jobs:
  exports:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node cream-export-check.cjs
      - run: node mobile-export-check.cjs
