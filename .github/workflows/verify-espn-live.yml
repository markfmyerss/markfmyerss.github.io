name: Verify live ESPN portraits
on:
  push:
    branches: [verify-espn-live]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-espn-live.cjs
