name: Prepare NBA Northwest assets
on:
  push:
    paths: ['scripts/prepare-nba-northwest.cjs', '.github/workflows/nba-northwest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        team: [DEN, MIN, OKC, POR, UTA]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-nba-northwest.cjs "${{ matrix.team }}"
