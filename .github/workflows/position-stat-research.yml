name: Position eligibility research
on:
  push:
    branches: [research-position-stat-baselines]
    paths: ['scripts/research-position-stats.cjs', '.github/workflows/position-stat-research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/research-position-stats.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: position-stat-research
          path: research-output/
          if-no-files-found: ignore
          retention-days: 30
