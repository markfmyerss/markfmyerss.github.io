name: Verify live weekly rosters
on:
  push:
    branches: [verify-weekly-rosters-live]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-nba-images.cjs
