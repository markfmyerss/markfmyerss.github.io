name: Verify live division headings
on:
  push:
    branches: [verify-division-headings-live]
permissions:
  contents: read
jobs:
  headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-nba-images.cjs live
