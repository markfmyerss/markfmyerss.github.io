name: Prepare NBA Central assets
on:
  push:
    paths: ['scripts/prepare-nba-central.cjs', '.github/workflows/nba-images.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        team: [CHI, CLE, DET, IND, MIL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-nba-central.cjs "${{ matrix.team }}"
