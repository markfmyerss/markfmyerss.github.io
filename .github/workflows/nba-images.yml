name: Verify scheduled Pages publishing
on:
  push:
    branches: [verify-weekly-pages-publishing]
permissions:
  contents: read
  pages: write
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-nba-images.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
