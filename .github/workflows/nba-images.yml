name: Verify live position rankings
on:
  push:
    branches: [verify-position-rankings-live]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node scripts/prepare-nba-images.cjs
