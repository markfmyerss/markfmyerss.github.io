name: Verify live NBA Northwest
on:
  push:
    branches: [verify-nba-northwest-live]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-nba-images.cjs northwest
