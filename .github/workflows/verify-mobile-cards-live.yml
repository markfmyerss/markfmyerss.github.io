name: Verify live mobile comparison cards
on:
  push:
    branches: [verify-mobile-cards-live]
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node verify-mobile-cards-live.cjs
      - run: node nba-mobile-comparison-check.cjs
        env:
          CARD_CHECK_URL: https://markfmyerss.github.io/?v=mobile-comparison-v2
      - run: node appearance-check.cjs
      - run: node design-check.cjs
      - run: node league-style-check.cjs
      - run: node flow-check.cjs
