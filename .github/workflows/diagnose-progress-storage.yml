name: Diagnose ranking persistence
on:
  push:
    paths: ['scripts/diagnose-progress-storage.cjs', '.github/workflows/diagnose-progress-storage.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node scripts/diagnose-progress-storage.cjs
