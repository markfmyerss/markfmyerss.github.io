name: Check approved league presentation
on:
  push:
    branches: [approved-league-branding]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node league-style-check.cjs
      - run: node appearance-check.cjs
      - name: Export review screenshots
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');for(const n of ['nfl','nba']){const p='qa/league-approved/'+n+'.png';if(fs.existsSync(p))console.log('APPROVED_SCREENSHOT '+n+' '+fs.readFileSync(p).toString('base64'));}
          NODE
