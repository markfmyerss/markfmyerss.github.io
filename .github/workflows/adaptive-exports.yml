name: Adaptive ranking image layout
on:
  push:
    paths: ['exports.js', 'index.html', 'adaptive-export-check.cjs', 'scripts/verify-adaptive-export-live.cjs', '.github/workflows/adaptive-exports.yml']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node adaptive-export-check.cjs
      - name: Verify live exporter after publication
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-adaptive-export-live.cjs
