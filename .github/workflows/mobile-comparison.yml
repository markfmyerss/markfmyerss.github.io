name: Mobile comparison cards
on:
  push:
    paths: ['styles.css', 'league-style.css', 'app.js', 'index.html', 'nba-mobile-comparison-check.cjs', '.github/workflows/mobile-comparison.yml']
  pull_request:
    paths: ['styles.css', 'league-style.css', 'app.js', 'index.html', 'nba-mobile-comparison-check.cjs', '.github/workflows/mobile-comparison.yml']
permissions:
  contents: read
jobs:
  mobile-cards:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node nba-mobile-comparison-check.cjs
        env:
          CARD_SCREENSHOTS: '1'
