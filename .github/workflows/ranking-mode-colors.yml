name: Check ranking mode colors
on:
  push:
    branches: [fix-ranking-mode-colors]
permissions:
  contents: read
jobs:
  colors:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: |
          node <<'NODE'
          const {chromium,webkit}=require('@playwright/test'),http=require('node:http'),fs=require('node:fs/promises'),path=require('node:path'),assert=require('node:assert/strict');
          (async()=>{const server=http.createServer(async(req,res)=>{try{const p=new URL(req.url,'http://localhost').pathname;const f=path.join(process.cwd(),p==='/'?'index.html':p);const b=await fs.readFile(f);res.setHeader('content-type',f.endsWith('.js')?'text/javascript':f.endsWith('.css')?'text/css':'text/html');res.end(b);}catch{res.statusCode=404;res.end();}});
          await new Promise(r=>server.listen(0,'127.0.0.1',r));try{for(const engine of [chromium,webkit]){const browser=await engine.launch();try{const page=await browser.newPage();await page.goto('http://127.0.0.1:'+server.address().port);await page.addStyleTag({content:'*,*::before,*::after{transition:none!important;animation:none!important}'});for(const sport of ['NBA','NFL']){await page.click('.sport-button[data-sport='+sport+']');for(const appearance of ['light','dim','black']){await page.click('[data-appearance-choice='+appearance+']');for(const width of [320,1440]){await page.setViewportSize({width,height:1000});for(const mode of ['teams','positions']){await page.click('.mode-button[data-mode='+mode+']');if(mode==='teams')await page.selectOption('#team',sport==='NBA'?'Boston Celtics':'Baltimore Ravens');await page.waitForTimeout(250);const styles=await page.evaluate(()=>[...document.querySelectorAll('#ranking-mode .mode-button')].map(b=>{const s=getComputedStyle(b);return {selected:b.getAttribute('aria-pressed')==='true',bg:s.backgroundColor,color:s.color}}));const on=styles.find(s=>s.selected),off=styles.find(s=>!s.selected);assert(on&&off);assert.equal(off.bg,'rgba(0, 0, 0, 0)','Inactive tab neutral');assert.notEqual(on.bg,off.bg);assert.notEqual(on.color,off.color);assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),'Responsive overflow');if(mode==='teams'){const fills=await page.evaluate(()=>['.sport-button[aria-pressed=true]','.conference-button[aria-pressed=true]','.mode-button[aria-pressed=true]'].map(s=>getComputedStyle(document.querySelector(s)).backgroundColor));assert.equal(new Set(fills).size,1,'Selected navigation colors consistent: '+fills.join(', '));}}}console.log('PASS '+engine.name()+' '+sport+' '+appearance+' selected/inactive colors, navigation consistency, mobile and desktop');}}}finally{await browser.close();}}}finally{await new Promise(r=>server.close(r));}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
