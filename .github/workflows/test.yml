name: Sorter checks
on:
  push:
    paths-ignore:
      - 'scripts/prepare-nba-atlantic.cjs'
      - 'scripts/prepare-nba-central.cjs'
      - 'scripts/prepare-nba-southeast.cjs'
      - 'scripts/prepare-nba-northwest.cjs'
      - 'scripts/prepare-nba-pacific.cjs'
      - 'scripts/prepare-nba-southwest.cjs'
      - '.github/workflows/nba-southwest.yml'
      - '.github/workflows/nba-pacific.yml'
      - '.github/workflows/nba-northwest.yml'
      - '.github/workflows/nba-southeast.yml'
      - 'scripts/prepare-nba-images.cjs'
      - '.github/workflows/nba-images.yml'
      - '.github/workflows/nba-snapshot.yml'
      - 'assets/link-preview.html'
      - 'scripts/render-link-preview.cjs'
      - '.github/workflows/link-preview.yml'
      - 'README.md'
      - 'DATA-SOURCES.md'
  pull_request:
permissions:
  contents: read
jobs:
  functionality:
    if: github.ref != 'refs/heads/mlb-expansion' && github.ref != 'refs/heads/prepare-nba-five-position-pools' && github.ref != 'refs/heads/prepare-approved-position-pools' && github.ref != 'refs/heads/prepare-ol-position-pools' && github.ref != 'refs/heads/prepare-injury-exceptions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --check app.js
          node --check exports.js
          node --check scripts/roster-tools.cjs
          node --check position-rankings-check.cjs
          node --check position-rankings-browser-check.cjs
      - name: Check static link-preview metadata and PNG
        run: node social-preview-check.cjs
      - name: Check all 30 NBA teams and saved rankings and saved rankings
        run: node nba-tests.cjs
      - name: Check randomized comparisons and saved order
        run: node shuffle-check.cjs
      - name: Check approved NFL eligibility and categories
        run: node eligibility-check.cjs
      - name: Check NBA starters and five primary positions
        run: node nba-position-check.cjs
      - name: Check league-wide position pools and compact progress
        run: node position-rankings-check.cjs
      - name: Check roster-change snapshots and baselines
        run: node roster-changes-check.cjs
      - name: Check weekly roster safeguards and current data
        run: |
          node weekly-rosters-check.cjs
          node scripts/build-roster-changes.cjs
          node roster-changes-check.cjs
          node current-rosters-check.cjs
      - name: Check ranking links and roster dates
        run: node ranking-links-check.cjs
      - name: Prepare official NFC West snapshot on GitHub
        run: node scripts/expand-nfc-west.cjs
      - name: Install browser checks on GitHub runner
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - name: Check favorite teams, search and optional roster dialogs
        run: node quality-of-life-browser-check.cjs
      - name: Check position tabs, mixed-team cards, links and dense images
        run: node position-rankings-browser-check.cjs
      - name: Export position archives for initial publication
        run: node scripts/export-position-archives.cjs
      - name: Check historical shared links and roster changes
        run: node weekly-rosters-browser-check.cjs
      - name: Check shared links on mobile and desktop
        run: node ranking-links-browser-check.cjs
      - name: Check NBA sport switching, cards and exports
        run: node nba-browser-check.cjs
      - name: Check Light, Dim and Lights Out appearances
        run: node appearance-check.cjs
      - name: Check complete ranking image layouts and downloads
        run: node export-check.cjs
      - name: Check mobile single-image saving in Chromium and WebKit
        run: node mobile-export-check.cjs
      - name: Check focused sorting and results flow
        run: node flow-check.cjs
      - name: Check approved league branding and existing saves
        run: node league-style-check.cjs
      - name: Check permanent Fresh design and responsive layouts
        run: node design-check.cjs
      - run: node tests.cjs
      - run: node headshots-check.cjs
      - run: node browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: qa/
          if-no-files-found: ignore
          retention-days: 7

  eligibility-sources:
    if: github.ref != 'refs/heads/mlb-expansion' && github.ref != 'refs/heads/prepare-nba-five-position-pools' && github.ref != 'refs/heads/prepare-approved-position-pools' && github.ref != 'refs/heads/prepare-ol-position-pools' && github.ref != 'refs/heads/prepare-injury-exceptions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit next weekly eligibility refresh without publishing
        run: |
          node scripts/refresh-position-pools.cjs
          node eligibility-check.cjs
          node scripts/refresh-nba-position-pools.cjs
          node nba-position-check.cjs
          node current-rosters-check.cjs
