name: Personal rankings tools
on:
  push:
    paths: ['app.js', 'index.html', 'ranking-tools.js', 'ranking-tools.css', 'ranking-tools-check.cjs', 'ranking-tools-browser-check.cjs', '.github/workflows/personal-rankings.yml']
  pull_request:
permissions:
  contents: read
jobs:
  ranking-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check ranking-tools.js
      - run: node ranking-tools-check.cjs
      - run: node tests.cjs
      - run: node nba-tests.cjs
      - run: node position-rankings-check.cjs
  browser-tools:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node ranking-tools-browser-check.cjs
      - run: node nba-mobile-comparison-check.cjs
      - run: node quality-of-life-browser-check.cjs
      - run: node flow-check.cjs
      - run: node appearance-check.cjs
