name: Verify live full portraits and cream exports
on:
  push:
    branches: [verify-full-portraits-cream-live]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node verify-full-portraits-cream-live.cjs
      - run: node verify-cream-outline-check.cjs
        env:
          CREAM_EXPORT_CHECK_URL: https://markfmyerss.github.io/?v=portrait-backdrops-v4
      - run: node mobile-export-check.cjs
