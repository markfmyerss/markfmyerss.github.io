name: League and division selection
on:
  push:
    paths: ['app.js', 'index.html', 'division-selection-check.cjs', '.github/workflows/division-selection.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node division-selection-check.cjs
