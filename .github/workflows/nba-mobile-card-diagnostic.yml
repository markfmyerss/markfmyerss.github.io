name: Diagnose mobile NBA comparison cards
on:
  push:
    branches: [diagnose-nba-mobile-cards]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node nba-mobile-card-diagnostic.cjs
