name: Verify weekly roster sources
on:
  push:
    branches: [prepare-weekly-rosters]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-weekly-rosters.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-roster-source-check
          path: |
            roster-probe.json
            assets/roster-snapshots/
