name: Verify ESPN portraits
on:
  push:
    branches: [fix-espn-portraits]
permissions:
  contents: read
jobs:
  portraits:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node scripts/verify-espn.cjs
