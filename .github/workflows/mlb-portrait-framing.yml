name: MLB portrait framing
on:
  push:
    paths: ['league-style.css', 'index.html', 'mlb-portrait-framing-check.cjs', '.github/workflows/mlb-portrait-framing.yml']
permissions:
  contents: read
jobs:
  portraits:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: node mlb-portrait-framing-check.cjs
      - run: node nba-mobile-comparison-check.cjs
