name: Prepare MLB 2026 source data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/mlb-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-mlb-2026.cjs
      - run: node scripts/finalize-mlb-2026.cjs
      - name: Save verified candidate data on GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mlb-data.js assets/mlb MLB-SOURCES.md assets/roster-snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Prepare historical MLB source data for review"
            git push origin HEAD:mlb-expansion
          fi
